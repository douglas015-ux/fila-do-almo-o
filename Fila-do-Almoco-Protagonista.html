<style>
:root{
  color-scheme:light;

  --ac:#1d6b4f;--acf:#fff;--ok:#e3f3ea;--okt:#17653f;

    color-scheme:dark;
    --bg:#151614;--card:#1f211e;--tx:#f0efe9;--mut:#a09f98;--bd:#34362f;
    --ac:#4fc08d;--acf:#0d1f17;--ok:#1b3a2b;--okt:#7fdcaa;
    --wa:#3d3115;--wat:#f0c36a;--lt:#43201c;--ltt:#ff9d92;--cur:#4fc08d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151614;--card:#1f211e;--tx:#f0efe9;--mut:#a09f98;--bd:#34362f;
  --ac:#4fc08d;--acf:#0d1f17;--ok:#1b3a2b;--okt:#7fdcaa;
  --wa:#3d3115;--wat:#f0c36a;--lt:#43201c;--ltt:#ff9d92;--cur:#4fc08d;
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--tx);
  font:clamp(16px,.25vw + 15.4px,18px)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  max-width:600px;margin:0 auto;
  padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}

header{margin:0 0 4px}
h1{font-size:clamp(20px,1.2vw + 16px,30px);line-height:1.2;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:clamp(12px,.6vw + 11px,14px);margin:2px 0 0}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tabs button{
  flex:1 1 auto;min-width:calc(33.333% - 6px);min-height:44px;
  padding:8px 10px;font:inherit;font-weight:600;
  font-size:clamp(12px,.6vw + 11px,15px);
  border:1px solid var(--bd);background:var(--card);color:var(--tx);
  border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.tabs button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}

#app{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:clamp(12px,2vw,18px);min-width:0}
.lbl{font-size:clamp(11px,.4vw + 10px,13px);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;margin:0 0 6px}

.big{font-size:clamp(48px,10vw,104px);font-weight:800;line-height:.95;color:var(--cur);letter-spacing:-.02em;overflow-wrap:anywhere}
.timer{font-size:clamp(30px,7vw,60px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.x{color:var(--ltt)}
.note{font-size:clamp(12px,.6vw + 11px,14px);color:var(--mut);margin:8px 0 0}
.destaque{font-weight:700;font-size:clamp(16px,1vw + 14px,18px);margin:8px 0 0}
.erro{color:var(--ltt)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ok);color:var(--okt);border-radius:99px;padding:4px 10px;font-size:clamp(12px,.4vw + 11px,14px);font-weight:600}
.chip .x{border:0;background:transparent;color:inherit;font:inherit;font-size:16px;line-height:1;padding:2px 4px;border-radius:50%;cursor:pointer}

.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd);min-width:0}
.row:first-of-type{border-top:0}
.row.mine{outline:2px solid var(--ac);outline-offset:-2px;border-radius:10px;padding-left:8px;padding-right:8px}
.pos{flex:0 0 2.4ch;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.t{flex:1 1 auto;min-width:0;font-weight:700;font-size:clamp(16px,1vw + 14px,19px);overflow-wrap:anywhere}
.tag{flex:0 0 auto;font-size:clamp(11px,.4vw + 10px,13px);font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.tag.espera{background:var(--wa);color:var(--wat)}
.tag.passou{background:var(--ok);color:var(--okt)}
.tag.atrasada{background:var(--lt);color:var(--ltt)}
.tag.vez{background:var(--ac);color:var(--acf)}

button.b{
  display:block;width:100%;min-height:48px;margin-top:8px;
  background:var(--ac);color:var(--acf);border:1px solid transparent;border-radius:10px;
  padding:12px 14px;font:inherit;font-weight:700;font-size:clamp(14px,.8vw + 12px,16px);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
button.b.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.b.d{background:var(--ltt);color:#fff}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.m{
  flex:0 0 auto;min-width:40px;min-height:40px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--bd);background:var(--card);color:var(--tx);
  border-radius:8px;padding:0 10px;font:inherit;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.btns{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:8px}
.btns button.b{margin-top:0}
.linha{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.linha input{flex:1 1 130px;width:auto}
.linha button.b{margin-top:0;width:auto;flex:0 0 auto;padding-left:20px;padding-right:20px}
.mt8{margin-top:8px}

select,input{
  font:inherit;width:100%;min-height:44px;padding:11px;
  border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);
}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

.banner{background:var(--wa);color:var(--wat);border-radius:10px;padding:8px 10px;font-size:clamp(12px,.6vw + 11px,14px);margin:10px 0 0}
#bn:empty{display:none}

.libras{border-radius:18px;padding:clamp(16px,3vw,26px) 14px;text-align:center;font-size:clamp(16px,1vw + 14px,20px);font-weight:600;min-width:0}
.libras .ico{font-size:clamp(48px,9vw,88px);line-height:1.1}
.libras .ttl{font-size:clamp(26px,6vw,52px);font-weight:800;margin:6px 0;line-height:1.05}
.libras .num{font-size:clamp(44px,10vw,96px);font-weight:800;margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
.libras.vez{background:var(--ac);color:var(--acf);animation:pisca 1s infinite}
.libras.wa{background:var(--wa);color:var(--wat)}
.libras.ok{background:var(--ok);color:var(--okt)}
.libras.lt{background:var(--lt);color:var(--ltt)}
.libras.n{background:var(--card);border:2px solid var(--bd)}

@keyframes pisca{50%{opacity:.4}}
body.flash::after{content:"";position:fixed;inset:0;border:12px solid var(--ac);pointer-events:none;animation:pisca 1s infinite}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;font-size:clamp(12px,.6vw + 11px,14px);margin-top:8px}
.steps span{display:block;font-size:clamp(26px,5vw,38px)}

a{color:var(--ac);font-weight:600}

@media (hover:hover){.tabs button:hover,button.m:hover{border-color:var(--ac)}}
@media (prefers-reduced-motion:reduce){.libras.vez,body.flash::after{animation:none}}

@media (min-width:620px){
  .btns{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:720px){
  body{max-width:1000px;padding-block:22px 48px;padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}
  #app{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .tabs button{flex:0 1 auto;min-width:0;padding:10px 20px}
  .steps{font-size:14px}
}
@media (min-width:1200px){
  body{max-width:1220px}
}
@media (max-width:380px){
  .tabs button{min-width:calc(50% - 6px)}
  .row{gap:6px}
  button.m{min-width:36px;padding:0 7px}
}
</style>
<header>
  <h1>🍽️ Fila do Almoço</h1>
  <p class="sub">Atualização em tempo real</p>
</header>

<div id="bn"></div>
<nav class="tabs" id="tabs" aria-label="Perfis de acesso"></nav>
<div id="live" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
"use strict";

/* ===== Configuração ===== */
const TURMAS=["101","102","103","201","202","203","301","302","303"];
/* PIN é proteção simples contra clique por engano. Não é segurança real:
   qualquer pessoa que abra o código-fonte consegue ler estes valores. */

const PRIOR=["Funcionários","Gestantes"];
const KINDS={funcionario:"Funcionário(a)",gestante:"Gestante"};
const NOMES={aluno:"Fila",libras:"🤟 Libras",prior:"⭐ Prioridades",gestao:"Gestão"};
const ADMIN_EMAIL="douglaslive015@gmail.com";
const PROTAGONISTA_EMAIL="lucadipedro@gmail.com";
const firebaseConfig={
  apiKey:"AIzaSyC2zYDVxLyeKJSwhTsTunW_ab82GojuyMI",
  authDomain:"fila-do-almoco-9a0e1.firebaseapp.com",
  projectId:"fila-do-almoco-9a0e1",
  storageBucket:"fila-do-almoco-9a0e1.firebasestorage.app",
  messagingSenderId:"12101866180",
  appId:"1:12101866180:web:dcbc56eb3c454767686f91",
  measurementId:"G-956JRHDSDC"
};

/* ===== Estado ===== */
function estadoPadrao(){
  return {order:TURMAS.slice(),st:{},called:null,tol:5,hist:[],turmas:TURMAS.slice(),day:null,sorteio:null};
}
let S=estadoPadrao();
let ref=null, modoLocal=false, role="aluno";
let P=[], pcol=null, auth=null, db=null, authUser=null, isAdmin=false, isGestor=false, unsubFila=null, unsubPrior=null;
let mine="", lastS="", zerou=false;
const semPreservar={tol:1};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aspas=v=>JSON.stringify(String(v));

try{mine=localStorage.getItem("minha")||""}catch(e){}

/* ===== Utilidades ===== */
function hoje(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function turmas(){return (S.turmas&&S.turmas.length)?S.turmas:TURMAS}
function diaAberto(){return !S.day||S.day===hoje()}
function statusDe(t){return S.st[t]||"espera"}

function lista(){
  const esp=[],atr=[],done=[];
  S.order.forEach(t=>{
    const s=statusDe(t);
    if(s==="espera")esp.push(t);
    else if(s==="atrasada")atr.push(t);
    else done.push(t);
  });
  return {ativas:esp.concat(atr),done:done,atual:esp[0]||atr[0]||null};
}
function atualAgora(){return diaAberto()?lista().atual:null}

function left(){
  if(!diaAberto())return null;
  const c=Number(S.called);
  if(!c)return null;
  return c+(Number(S.tol)||5)*60000-Date.now();
}
function fmt(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function hhmm(ts){
  return new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function mediaMin(){
  const h=S.hist||[];
  if(h.length>1){
    const gaps=[];
    for(let i=1;i<h.length;i++){
      const d=h[i].at-h[i-1].at;
      if(d>60000&&d<1800000)gaps.push(d);
    }
    if(gaps.length)return gaps.reduce((a,b)=>a+b,0)/gaps.length/60000;
  }
  return Number(S.tol)||5;
}
function previsao(t){
  const {ativas}=lista();
  const i=ativas.indexOf(t);
  if(i<0)return null;
  const lf=left();
  const espera=(lf!==null&&lf>0)?lf:0;
  return Date.now()+espera+i*mediaMin()*60000;
}

/* ===== Persistência ===== */
function banner(txt){
  const el=$("bn");
  if(el)el.innerHTML=txt?'<div class="banner">'+esc(txt)+'</div>':"";
}

let filaEscrita=Promise.resolve();
function gravar(patch){
  const p=filaEscrita.then(()=>enviar(patch));
  filaEscrita=p.catch(()=>{});
  return p;
}
async function enviar(patch){
  try{
    await ref.update(patch);
    return true;
  }catch(e1){
    console.error("Falha ao salvar",e1);
    return false;
  }
}

async function save(patch){
  if(!isGestor){banner("Somente a equipe autorizada pode alterar a fila.");return}
  const antes=S;
  S=Object.assign({},S,patch);
  render();
  if(!ref){
    modoLocal=true;
    banner("Modo local: as alterações não são compartilhadas com outros aparelhos.");
    return;
  }
  const ok=await gravar(patch);
  if(!ok){
    S=antes;
    render();
    banner("Não foi possível salvar. Verifique a conexão e tente de novo.");
  }else{
    banner("");
  }
}

/* ===== Ações da equipe ===== */
function chamar(t){
  if(t&&t!==lista().atual)return render();
  save({called:Date.now()});
}
function passou(t){
  const at=lista().atual;
  if(!at||t!==at)return render();
  const st=Object.assign({},S.st); st[t]="passou";
  const hist=(S.hist||[]).concat([{t:t,at:Date.now()}]).slice(-80);
  const order=S.order.filter(x=>x!==t).concat([t]);
  save({st:st,called:null,hist:hist,order:order});
}
function atrasar(t){
  const at=lista().atual;
  if(!at||t!==at)return render();
  const st=Object.assign({},S.st); st[t]="atrasada";
  const order=S.order.filter(x=>x!==t).concat([t]);
  save({st:st,called:null,order:order});
}
function stSet(t,s){
  const at=lista().atual;
  const st=Object.assign({},S.st);
  st[t]=s;
  const mover=(s==="passou"||s==="atrasada");
  save({
    st:st,
    called:(t===at)?null:S.called,
    order:mover?S.order.filter(x=>x!==t).concat([t]):S.order
  });
}
function mv(t,d){
  const antes=lista().atual;
  const ativas=lista().ativas;
  const a=ativas.slice();
  const i=a.indexOf(t), j=i+d;
  if(i<0||j<0||j>=a.length)return;
  const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  const rest=S.order.filter(x=>a.indexOf(x)<0);
  save({order:a.concat(rest),called:a[0]===antes?S.called:null});
}
function setTol(v){
  const n=Math.round(Number(v));
  save({tol:Math.min(30,Math.max(1,isFinite(n)&&n?n:5))});
}
function stZero(){const o={};turmas().forEach(t=>{o[t]="espera"});return o}
function abrirDia(){
  save({day:hoje(),order:turmas().slice(),st:stZero(),called:null,hist:[],sorteio:null});
  limparPrior();
}
function reiniciar(){
  ask("reiniciar",null,"Reiniciar a fila do dia? Todas as turmas voltam para a espera.");
}
function fazerReiniciar(){
  save({day:hoje(),order:turmas().slice(),st:stZero(),called:null,hist:[],sorteio:null});
}

/* Confirmação dentro da página (o navegador do site não mostra confirm()) */
let conf=null;
function ask(kind,arg,txt){
  conf={kind:kind,arg:arg,txt:txt};render();
  const el=document.querySelector('[role="alertdialog"]');
  if(el&&el.scrollIntoView){try{el.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}}
}
function confirmar(sim){
  const c=conf; conf=null;
  if(sim&&c){
    if(c.kind==="reiniciar")fazerReiniciar();
    else if(c.kind==="delTurma")fazerDelTurma(c.arg);
    else if(c.kind==="sortear")fazerSortear();
    else render();
  }else render();
}
function addTurma(){
  const el=$("nt"); if(!el)return;
  const n=el.value.trim().replace(/[^0-9A-Za-zÀ-ÿ _-]/g,"").slice(0,12);
  if(!n)return;
  if(turmas().indexOf(n)>=0){banner("Essa turma já existe.");return}
  const ts=turmas().slice(); ts.push(n);
  ts.sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
  const st=Object.assign({},S.st); st[n]="espera";
  save({turmas:ts,order:S.order.filter(x=>x!==n).concat([n]),st:st});
}
function delTurma(t){
  if(turmas().length<2){banner("Não é possível remover todas as turmas.");return}
  ask("delTurma",t,"Remover a turma "+t+"?");
}
function fazerDelTurma(t){
  const ts=turmas().filter(x=>x!==t);
  if(!ts.length)return render();
  save({turmas:ts,order:S.order.filter(x=>x!==t)});
}

/* ===== Prioridades (fila única) ===== */
function limparPrior(){
  if(!isAdmin)return;
  if(!pcol){P=[];return}
  P.slice().forEach(x=>{pcol.doc(x.id).delete().catch(()=>{})});
}
async function addP(){
  if(!authUser){banner("Entre com Google para solicitar prioridade.");return}
  const el=$("gn");
  const n=el?el.value.trim():"";
  if(!n)return;
  const k=$("pk")?$("pk").value:"";
  if(!KINDS[k]){banner("Escolha Funcionário(a) ou Gestante.");return}
  const sel=$("gtu");
  const at=Date.now();
  const id=String(at)+"-"+Math.random().toString(36).slice(2,6);
  const item={n:n.slice(0,24),k:k,t:sel?sel.value:"",ok:false,aprovado:false,at:at,uid:authUser.uid,email:authUser.email||""};
  if(el)el.value="";
  if(!pcol){
    modoLocal=true;
    P=P.concat([Object.assign({id:id},item)]);
    banner("Modo local: as alterações não são compartilhadas com outros aparelhos.");
    render();return;
  }
  try{await pcol.doc(id).set(item);banner("Solicitação enviada! Aguarde a análise da administração.");render()}
  catch(e){banner("Não foi possível registrar. Verifique a conexão e tente de novo.")}
}
async function aprovarP(id){
  if(!isAdmin)return;
  if(!pcol)return;
  try{await pcol.doc(id).update({aprovado:true})}catch(e){banner("Não foi possível aprovar a solicitação.")}
}
async function okP(id){
  if(!isAdmin)return;
  if(!pcol){P=P.map(x=>x.id===id?Object.assign({},x,{ok:true}):x);render();return}
  try{await pcol.doc(id).update({ok:true})}catch(e){banner("Não foi possível salvar. Tente de novo.")}
}
async function delP(id){
  if(!isAdmin)return;
  if(!pcol){P=P.filter(x=>x.id!==id);render();return}
  try{await pcol.doc(id).delete()}catch(e){banner("Não foi possível remover. Tente de novo.")}
}

/* ===== Sorteio da ordem das turmas (só protagonistas) ===== */
function rnd(n){
  const c=window.crypto;
  if(!c||!c.getRandomValues)return Math.floor(Math.random()*n);
  const lim=Math.floor(4294967296/n)*n, b=new Uint32Array(1);
  do{c.getRandomValues(b)}while(b[0]>=lim);
  return b[0]%n;
}
function aguardando(){return lista().ativas.filter(t=>statusDe(t)==="espera")}
function sorteioHoje(){
  return !!(S.sorteio&&S.sorteio.at&&new Date(S.sorteio.at).toDateString()===new Date().toDateString());
}
function sortear(){
  if(!diaAberto()){banner("Abra a fila de hoje na aba Gestão antes de sortear.");return}
  const n=aguardando().length;
  if(n<2){banner("É preciso ter pelo menos 2 turmas aguardando para sortear.");return}
  ask("sortear",null,"Sortear a ordem das "+n+" turmas que estão aguardando? A ordem atual será substituída e a chamada em andamento será cancelada.");
}
function fazerSortear(){
  const a=aguardando();
  if(a.length<2)return render();
  for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t}
  const rest=S.order.filter(x=>a.indexOf(x)<0);
  save({order:a.concat(rest),called:null,sorteio:{at:Date.now(),ordem:a.slice()}});
}

/* ===== Abas e autenticação ===== */
function tab(r){
  if(r==="gestao"&&!isGestor)return;
  role=r;conf=null;render();
}
async function loginGoogle(){
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){
    console.error(e);
    const el=$("loginErro");
    if(el)el.textContent="Não foi possível entrar. Verifique a conta Google e tente novamente.";
  }
}
async function sair(){try{await auth.signOut()}catch(e){banner("Não foi possível sair. Tente novamente.")}}

/* ===== Alertas ===== */
function minhaSit(){
  if(!mine||!diaAberto())return "";
  const {ativas,atual}=lista();
  const s=statusDe(mine);
  if(s==="passou")return "passou";
  if(mine===atual)return "vez";
  if(s==="atrasada")return "atrasada";
  return ativas.indexOf(mine)===1?"proxima":"espera";
}
function anunciar(msg){
  const l=$("live");
  if(l&&l.textContent!==msg)l.textContent=msg;
}
function alerta(){
  const m=minhaSit();
  document.body.classList.toggle("flash",m==="vez");
  if(m==="vez"&&lastS!=="vez"){
    if(navigator.vibrate){try{navigator.vibrate([300,150,300,150,600])}catch(e){}}
    anunciar("Atenção: é a vez da turma "+mine+". Vá para a fila agora.");
  }else if(m==="proxima"&&lastS!=="proxima"){
    anunciar("Prepare-se: a turma "+mine+" é a próxima.");
  }else if(m==="atrasada"&&lastS!=="atrasada"){
    anunciar("A turma "+mine+" foi para o final da fila.");
  }
  lastS=m;
  document.title=(m==="vez")?("🔔 SUA VEZ · "+mine):"Fila do Almoço";
}

/* ===== Componentes ===== */
function tag(t,atual){
  const s=statusDe(t);
  if(t===atual)return '<span class="tag vez">NA VEZ</span>';
  const lbl={espera:"Aguardando",passou:"Já passou",atrasada:"No final"};
  return '<span class="tag '+s+'">'+(lbl[s]||lbl.espera)+'</span>';
}

function ordem(ativas,done,atual,edit){
  let h='<section class="card"><h2 class="lbl">Ordem da fila</h2>';
  if(!ativas.length)h+='<p class="note">Nenhuma turma na fila.</p>';
  ativas.forEach((t,i)=>{
    h+='<div class="row'+(t===mine?' mine':'')+'">'+
      '<span class="pos">'+(i+1)+'º</span>'+
      '<span class="t">'+esc(t)+'</span>'+
      tag(t,atual)+
      (edit?'<button class="m" aria-label="Subir a turma '+esc(t)+'" onclick=\'mv('+aspas(t)+',-1)\'>↑</button>'+
            '<button class="m" aria-label="Descer a turma '+esc(t)+'" onclick=\'mv('+aspas(t)+',1)\'>↓</button>':'')+
      '</div>';
  });
  h+='</section>';

  if(done.length){
    h+='<section class="card"><h2 class="lbl">Já passaram</h2>';
    done.forEach(t=>{
      h+='<div class="row'+(t===mine?' mine':'')+'">'+
        '<span class="t">'+esc(t)+'</span>'+tag(t,atual)+
        (edit?'<button class="m" aria-label="Voltar a turma '+esc(t)+' para a fila" onclick=\'stSet('+aspas(t)+',"espera")\'>Voltar</button>':'')+
        '</div>';
    });
    h+='</section>';
  }
  return h;
}

/* ===== Telas ===== */

  let h="";

  }else{
    h+='<p class="note">Todas as turmas já passaram 🎉</p>';
  }
  h+='<div class="chips">'+PRIOR.map(p=>'<span class="chip">⭐ '+p+'</span>').join("")+'</div>'+
     '<p class="note">As prioridades aprovadas passam na frente. Depois, seguem as turmas na ordem abaixo.</p>'+
     (sorteioHoje()?'<p class="note">🎲 Ordem sorteada às '+hhmm(S.sorteio.at)+' pelos protagonistas.</p>':'')+'</section>';

  h+='<section class="card"><h2 class="lbl">Qual é a sua turma?</h2>'+

    const i=ativas.indexOf(mine);
    let txt="";
    if(s==="passou")txt="✅ A turma "+esc(mine)+" já passou.";
    else if(mine===atual)txt="👉 Sua turma está na vez! Vá para a fila.";
    else if(s==="atrasada")txt="⚠️ A turma "+esc(mine)+" foi para o final por não ter comparecido. Agora há "+i+" turma(s) antes.";

function priorLista(staff){
  const lst=P.filter(x=>x&&x.n).slice().sort((a,b)=>(a.at||0)-(b.at||0)||String(a.id).localeCompare(String(b.id)));
  const pend=lst.filter(x=>x.aprovado!==true);
  const aprov=lst.filter(x=>x.aprovado===true&&!x.ok);
  const ok=lst.filter(x=>x.aprovado===true&&x.ok);
  const info=x=>esc(x.n)+' <span class="note" style="margin:0">· '+esc(KINDS[x.k]||"Prioridade")+(x.t?' · '+esc(x.t):'')+'</span>';
  let h='';
  if(staff){
    h+='<section class="card"><h2 class="lbl">Solicitações pendentes ('+pend.length+')</h2>';
    if(pend.length)pend.forEach(x=>{h+='<div class="row"><span class="t">'+info(x)+'</span><button class="m" onclick=\'aprovarP('+aspas(x.id)+')\'>Aprovar</button><button class="m" onclick=\'delP('+aspas(x.id)+')\'>Recusar</button></div>'});
    else h+='<p class="note">Nenhuma solicitação aguardando aprovação.</p>';
    h+='</section>';
  }
  h+='<section class="card"><h2 class="lbl">Prioridades aprovadas · aguardando ('+aprov.length+')</h2>';
  if(aprov.length)aprov.forEach((x,i)=>{h+='<div class="row"><span class="pos">'+(i+1)+'º</span><span class="t">'+info(x)+'</span><span class="tag espera">Aprovada</span>'+(staff?'<button class="m" onclick=\'okP('+aspas(x.id)+')\'>Atendido</button><button class="m" onclick=\'delP('+aspas(x.id)+')\'>×</button>':'')+'</div>'});
  else h+='<p class="note">Nenhuma prioridade aprovada aguardando atendimento.</p>';
  h+='</section>';
  if(ok.length)h+='<section class="card"><h2 class="lbl">Prioridades atendidas</h2>'+ok.map(x=>'<div class="row"><span class="t">'+info(x)+'</span><span class="tag passou">Atendido(a)</span>'+(staff?'<button class="m" onclick=\'delP('+aspas(x.id)+')\'>×</button>':'')+'</div>').join('')+'</section>';
  return h;
}

/* ===== Render ===== */
function render(){
  const ativo=document.activeElement;
  const foco=(ativo&&ativo.id)?ativo.id:null;

  const vals={};
  document.querySelectorAll("#app input[id],#app select[id]").forEach(el=>{
    if(!semPreservar[el.id])vals[el.id]=el.value;
  });

  if(!authUser){
    $("tabs").innerHTML="";
    $("app").innerHTML='<section class="card"><h2 class="lbl">Acesso ao Fila do Almoço</h2><p class="note">Entre com sua conta Google para consultar a fila e solicitar prioridade, quando necessário.</p><button class="b" onclick="loginGoogle()">Entrar com Google</button><p class="note erro" id="loginErro"></p></section>';
    return;
  }
  alerta();

  const abas=isGestor?Object.keys(NOMES):["aluno","libras","prior"];
  $("tabs").innerHTML=abas.map(r=>
    '<button type="button" class="'+(role===r?"on":"")+'" aria-pressed="'+(role===r?"true":"false")+'" onclick=\'tab('+aspas(r)+')\'>'+NOMES[r]+'</button>'
  ).join("");

  if(!abas.includes(role))role="aluno";
  $("app").innerHTML=
    role==="aluno"?viewAluno():
    role==="libras"?viewLibras():
    role==="prior"?viewPrior():
    (isGestor?viewGestao():viewAluno());
  $("app").insertAdjacentHTML("beforeend",'<section class="card"><p class="note">Conectado como '+esc(authUser.email||"conta Google")+'</p><button class="b s" onclick="sair()">Sair da conta</button></section>');

  if(conf){
    $("app").insertAdjacentHTML("afterbegin",'<section class="card" role="alertdialog" aria-label="Confirmação"><h2 class="lbl">Confirmar ação</h2><p class="destaque">'+esc(conf.txt)+'</p><div class="linha"><button type="button" class="b d" onclick="confirmar(true)">Confirmar</button><button type="button" class="b s" onclick="confirmar(false)">Cancelar</button></div></section>');
  }

  Object.keys(vals).forEach(id=>{
    const el=document.getElementById(id);
    if(el&&el.value!==vals[id])el.value=vals[id];
  });

  if(foco){
    const el=document.getElementById(foco);
    if(el&&document.activeElement!==el){
      try{el.focus({preventScroll:true})}catch(e){el.focus()}
    }
  }

  const lf=left();
  zerou=(lf!==null&&lf<=0);
}

/* ===== Cronômetro sem redesenhar a tela ===== */
function tick(){
  const lf=left();
  const el=document.getElementById("tmr");
  if(el&&lf!==null){
    el.textContent=lf>0?fmt(lf):(el.getAttribute("data-zero")||"Tolerância esgotada");
    el.classList.toggle("x",lf<=0);
  }
  if(lf!==null&&lf<=0&&!zerou){zerou=true;render()}
}

/* ===== Início: Firebase Authentication + Firestore ===== */
async function init(){
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    auth=firebase.auth();
    db=firebase.firestore();
    auth.onAuthStateChanged(async user=>{
      authUser=user||null;
      isAdmin=!!(user&&user.email&&user.email.toLowerCase()===ADMIN_EMAIL&&user.emailVerified);
      isGestor=isAdmin||!!(user&&user.email&&user.email.toLowerCase()===PROTAGONISTA_EMAIL&&user.emailVerified);
      role="aluno";conf=null;ref=null;pcol=null;P=[];
      if(unsubFila){unsubFila();unsubFila=null}
      if(unsubPrior){unsubPrior();unsubPrior=null}
      if(!user){render();return}
      modoLocal=false;
      ref=db.doc("fila/estado");
      pcol=db.collection("prioridades");
      const t10=setTimeout(()=>banner("Ainda sem resposta da fila. Os dados podem estar desatualizados."),10000);
      unsubFila=ref.onSnapshot(async snap=>{
        if(!snap.exists){
          if(isGestor){try{await ref.set(estadoPadrao())}catch(e){banner("Não foi possível inicializar a fila. Confira as regras do Firestore.")}}
          else banner("A fila ainda não foi inicializada pela administração.");
          render();return;
        }
        const d=snap.data()||{};
        S={order:(Array.isArray(d.order)&&d.order.length?d.order.slice():TURMAS.slice()),st:(d.st&&typeof d.st==="object")?d.st:{},called:Number(d.called)||null,tol:Number(d.tol)||5,hist:Array.isArray(d.hist)?d.hist:[],turmas:(Array.isArray(d.turmas)&&d.turmas.length?d.turmas.slice():TURMAS.slice()),day:d.day||null,sorteio:(d.sorteio&&typeof d.sorteio==="object")?d.sorteio:null};
        turmas().forEach(t=>{if(S.order.indexOf(t)<0)S.order.push(t)});
        clearTimeout(t10);banner("");render();
      },err=>{clearTimeout(t10);console.error(err);banner("Sem permissão para ler a fila. Confira as regras do Firestore.")});
      if(isAdmin){
        unsubPrior=pcol.onSnapshot(snap=>{P=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()},err=>{console.error(err);banner("Sem permissão para ler prioridades. Confira as regras do Firestore.")});
      }
      render();
    });
  }catch(e){console.error(e);banner("Não foi possível iniciar o Firebase. Confira a configuração do projeto.");render()}
}

setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
window.addEventListener("online",()=>{banner("");render()});
window.addEventListener("offline",()=>banner("Sem conexão. Os dados podem estar desatualizados."));

init();
</script>
